<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Сайт для публікації фотографій">
  <meta name="keywords" content="публікація фотографій, Firstframe, авторизація">
  <link rel="stylesheet" href="css/style_all.css">
</head>

<body>
  <header class="header">
    <nav class="header__menu-bar">
      <a class="menu-bar__logo" href="search_page.html">FirstShot</a>
      <div class="menu-bar__button-in-menu">
        <a class="button-in-menu__button" href="main_page.html">На головну</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="registracion">
      <table>
        <thead>
          <h2>Реєстрація користувача</h2>
        </thead>
        <tbody>
          <tr>
            <td>
              <label for="user_name">Ім'я користувача:</label>
            </td>
            <td>
              <input required name="user_name" id="user_name">
            </td>
          </tr>
          <tr>
            <td>
              <label for="password">Пароль:</label><br>
              <label for="password_1">Повторення пароля:</label>
            </td>
            <td>
              <input id="password"><br>
              <input id="password_1">
            </td>
          </tr>
          <tr>
            <td>
              <label for="user_email">Електронна пошта:</label>
            </td>
            <td>
              <input type="email" name="user_email" placeholder="e-mail@gmail.com" id="user_email">
            </td>
          </tr>
          <tr>
            <td>
              <label for="tel">Номер телефону:</label>
            </td>
            <td>
              <input type="tel" name="user_phone" pattern="^\+380\d{9}$" placeholder="+380 00 000 0000" id="tel">
            </td>
          </tr>
          <tr>
            <td>
              <label for="url">Ваш ютуб канал:</label>
            </td>
            <td>
              <input type="url" name="user_site" placeholder="https://example.com" id="url">
            </td>
          </tr>
          <tr>
            <td>
              <label for="datetime">Дата народження:</label>
            </td>
            <td>
              <input type="datetime-local" name="reg_datetime" id="datetime">
            </td>
          </tr>
        </tbody>
      </table>
      <button type="submit">Зареєструватися</button>
      <br>
      <iframe
        src="https://support.microsoft.com/uk-ua/windows/%D1%81%D1%82%D0%B2%D0%BE%D1%80%D0%B5%D0%BD%D0%BD%D1%8F-%D1%82%D0%B0-%D0%B2%D0%B8%D0%BA%D0%BE%D1%80%D0%B8%D1%81%D1%82%D0%B0%D0%BD%D0%BD%D1%8F-%D0%BD%D0%B0%D0%B4%D1%96%D0%B9%D0%BD%D0%B8%D1%85-%D0%BF%D0%B0%D1%80%D0%BE%D0%BB%D1%96%D0%B2-c5cebb49-8c53-4f5e-2bc4-fe357ca048eb"
        width="600" height="400"></iframe>
    </section>
  </main>
  <footer class="footer">
    <p class="footer__heading" id="contact_information"><b>Інформація для зв'язку</b></p>
    <ul class="footer__contact-information" id="contact_information">
      <li>
        <a class="contact-information__github-link" href="https://github.com/Mykhailo-RomanetsNURE" target="_blank"
          rel="noopener">Посилання на GitHub
        </a>
      </li>
      <li>
        <a class="contact-information__git-link"
          href="https://github.com/Mykhailo-RomanetsNURE/Mykhailo-RomanetsNURE_GtaGm_Lab_Project.git" target="_blank"
          rel="noopener">Посилання на git репозиторій</a>
      </li>
      <li>
        За виявлення багів або якщо є ідеї для покращення писати на e-mail:
        <a class="contact-information__email-link" href="mailto:mykhailo.romanets@nure.ua">
          <i>mykhailo.romanets@nure.ua</i>
        </a>
      </li>
      <li class="contact-information__tlegram-link">Телеграм: <i>@MikhaiI_R</i></li>
    </ul>
  </footer>
</body>

</html>
