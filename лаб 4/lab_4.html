<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.css">

  <style>
    body {
      background-color: rgb(18, 18, 18);
      color: rgb(163, 163, 163);
    }

    .row {
      margin-top: 15px;
      margin-bottom: 15px;
    }

    .block-row-1 {
      background-color: rgb(0, 0, 50);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .block-row-2-parent {
      background-color: rgb(50, 0, 0);
      border-radius: 12px;
      padding: 15px;
    }

    .block-row-2-nested {
      background-color: rgb(81, 52, 0);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .block-row-3 {
      background-color: rgb(0, 50, 0);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="row justify-content-start">
      <div class="col-5 col-lg-6">
        <div class="block-row-1 my-5">1.1</div>
      </div>
      <div class="col-5 col-lg-6">
        <div class="block-row-1 my-5">1.2</div>
      </div>
    </div>
    <div class="row my-5">
      <div class="block-row-2-parent">

        <div class="col-5 d-none d-md-block">
          <div class="block-row-2-nested">2.1</div>
        </div>
        <div class="col-5">
          <div class="block-row-2-nested">2.2</div>
        </div>

      </div>
    </div>
    <div class="row">
      <div class="col-7">
        <div class="block-row-3">3.1</div>
      </div>
      <div class="col-3 d-none d-sm-block">
        <div class="block-row-3">3.2</div>
      </div>
      <div class="col-2 offset-3 offset-sm-0">
        <div class="block-row-3">3.3</div>
      </div>
    </div>
  </div>
</body>

<script src="js/bootstrap.js"></script>

</html>
