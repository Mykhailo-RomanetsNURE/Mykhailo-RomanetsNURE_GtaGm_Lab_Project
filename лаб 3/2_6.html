<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: black;
    }

    #colored-text {
      font-size: 28px;
      font-weight: bold;
      font-family: sans-serif;
      margin: 30px;
    }
  </style>
</head>

<body>
  <div id="colored-text"></div>
</body>

<script>
  const phrase = "6. Вивести на екран фразу, розфарбувавши її букви в заданий діапазон кольорів (якщо букв більше, ніж кольорів, то застосовувати кольори по колу).";
  const colors = ["red", "green", "blue", "orange", "purple", "cyan", "aqua", "hotpink"];
  const container = document.getElementById('colored-text');

  for (let i = 0; i < phrase.length; i++) {
    const span = document.createElement('span');
    span.innerText = phrase[i];
    span.style.color = colors[i % colors.length];
    container.appendChild(span);
  }
</script>

</html>
