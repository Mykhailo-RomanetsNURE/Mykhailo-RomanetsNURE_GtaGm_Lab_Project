<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: "Comic Sans MS", cursive;
      background-color: rgb(40, 40, 40);
      color: rgb(199, 199, 199);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: rgb(20, 20, 20);
      padding: 30px;
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
    }

    .file-input-wrapper {
      position: relative;
      margin: 20px 0;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .file-label {
      background-color: #000000;
      padding: 10px 20px;
      border-radius: 6px;
      display: inline-block;
    }

    .info-block {
      margin-top: 20px;
      padding-top: 15px;
      display: none;
    }

    .info-item {
      margin: 10px 0;
      font-size: 15px;
    }

    .preview {
      max-width: 100%;
      max-height: 500px;
      border-radius: 6px;
      margin-top: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .note {
      font-size: 12px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="file-input-wrapper">
      <label for="photoInput" class="file-label">Обрати фотографію</label>
      <input type="file" id="photoInput" accept="image/*">
    </div>

    <div id="infoBlock" class="info-block">
      <img id="photoPreview" class="preview" src="" alt="Прев'ю фото">
      <div class="info-item"><strong>Ім'я:</strong> <span id="fileName">-</span></div>
      <div class="info-item"><strong>Розмір:</strong> <span id="fileSize">-</span></div>
      <div class="info-item"><strong>Дата останньої зміни:</strong> <span id="fileDate">-</span></div>
    </div>
  </div>
</body>

<script>
  document.getElementById('photoInput').addEventListener('change', function (event) {
    const file = event.target.files[0];
    const infoBlock = document.getElementById('infoBlock');
    if (!file) return;
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(3) + ' МБ (' + file.size + ' байт)';
    document.getElementById('fileDate').textContent = new Date(file.lastModified).toLocaleString();
    const reader = new FileReader();
    reader.onload = function (e) {
      const previewImg = document.getElementById('photoPreview');
      previewImg.src = e.target.result;
      infoBlock.style.display = 'block';
    }
    reader.readAsDataURL(file);
  });
</script>

</html>
